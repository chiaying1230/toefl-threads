<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Toefl-Tofu">
  <meta name="application-name" content="Toefl-Tofu">
  <meta name="description" content="Toefl-Tofu: a Threads-style feed where funny characters post with TOEFL vocabulary.">
  <title>Toefl-Tofu</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn plain back-btn" id="backBtn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="brand" id="brand">
        <svg class="logo tofu" style="width:30px;height:30px" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="18" width="48" height="38" rx="12" fill="#E9D3A3"/><rect x="8" y="12" width="48" height="38" rx="12" fill="#FFF6E0" stroke="#E7CF9C" stroke-width="2"/><circle cx="23.5" cy="31" r="3.2" fill="#3B2F2F"/><circle cx="40.5" cy="31" r="3.2" fill="#3B2F2F"/><ellipse cx="17.5" cy="37" rx="4" ry="2.4" fill="#FFB4A8"/><ellipse cx="46.5" cy="37" rx="4" ry="2.4" fill="#FFB4A8"/><path d="M28.5 37.5q3.5 3.5 7 0" stroke="#3B2F2F" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
        <h1 class="topbar-title" id="topbarTitle">Toefl-Tofu</h1>
      </div>
      <button class="goal-chip" id="goalChip" aria-label="Daily goal"></button>
    </div>
  </header>

  <main>
    <!-- Home -->
    <section class="view" id="view-home">
      <div class="feed-tabs" role="tablist">
        <button class="feed-tab active" data-feed="foryou" role="tab">For you</button>
        <button class="feed-tab" data-feed="following" role="tab">Following</button>
      </div>
      <div id="installSlot"></div>
      <div class="composer-prompt" id="composerPrompt" data-action="compose">
        <div class="avatar sm" id="promptAvatar"></div>
        <span>Start a thread… try using a new word!</span>
      </div>
      <div id="feed" class="feed"></div>
      <div id="feedSentinel" class="sentinel"></div>
    </section>

    <!-- Search -->
    <section class="view" id="view-search" hidden>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="searchInput" type="search" placeholder="Search words, people, #topics" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div id="searchBody"></div>
    </section>

    <!-- Review -->
    <section class="view" id="view-review" hidden>
      <div class="segmented" role="tablist">
        <button class="seg active" data-mode="list" role="tab">Word list</button>
        <button class="seg" data-mode="cards" role="tab">Flashcards</button>
      </div>
      <div id="reviewBody"></div>
    </section>

    <!-- My profile -->
    <section class="view" id="view-profile" hidden>
      <div id="profileBody"></div>
    </section>

    <!-- Someone else's profile (character or user) -->
    <section class="view" id="view-person" hidden>
      <div id="personBody"></div>
    </section>

    <!-- A single thread with replies -->
    <section class="view" id="view-thread" hidden>
      <div id="threadBody"></div>
      <div class="reply-bar" id="replyBar">
        <div class="avatar sm" id="replyAvatar"></div>
        <input id="replyInput" maxlength="300" placeholder="Reply… use a TOEFL word!" autocomplete="off">
        <button class="post-btn small" id="replySend" disabled>Post</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-go="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
    </button>
    <button class="tab" data-go="search" aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
    <button class="tab" data-action="compose" aria-label="New thread">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    </button>
    <button class="tab" data-go="review" aria-label="Review">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <b class="badge" id="reviewBadge" hidden>0</b>
    </button>
    <button class="tab" data-go="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
    </button>
  </nav>

  <!-- Word sheet -->
  <div class="overlay" id="sheetOverlay" hidden></div>
  <div class="sheet" id="wordSheet" role="dialog" aria-modal="true" aria-labelledby="sheetWord" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheetWord"></h2>
        <div class="kk" id="sheetKK"></div>
        <div class="sheet-meta"><span id="sheetPos"></span> <span class="level-tag" id="sheetLevel"></span></div>
      </div>
      <button class="icon-btn" id="speakBtn" aria-label="Pronounce">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </div>
    <p class="sheet-zh" id="sheetZh"></p>
    <div class="sheet-example">
      <div class="label">Example</div>
      <p id="sheetEx"></p>
      <p class="muted" id="sheetExZh"></p>
    </div>
    <div class="sheet-actions">
      <button class="primary-btn" id="sheetSave"></button>
      <button class="outline-btn" id="sheetMore">More threads with this word</button>
    </div>
  </div>

  <!-- "Add to Home Screen" guide -->
  <div class="sheet" id="installGuide" role="dialog" aria-modal="true" aria-label="Add to Home Screen" hidden></div>

  <!-- Composer -->
  <div class="composer" id="composer" role="dialog" aria-modal="true" aria-label="New thread" hidden>
    <div class="composer-top">
      <button class="text-btn" id="composerCancel">Cancel</button>
      <strong>New thread</strong>
      <span class="spacer"></span>
    </div>
    <div class="challenge">
      <div class="challenge-head">
        <span>🎯 Word challenge — tap to insert</span>
        <button class="text-btn small" id="challengeShuffle">Shuffle</button>
      </div>
      <div class="challenge-words" id="challengeWords"></div>
    </div>
    <div class="composer-body">
      <div class="avatar" id="composerAvatar"></div>
      <div class="composer-main">
        <div class="name" id="composerName"></div>
        <textarea id="composerText" maxlength="500" rows="5" placeholder="What's new? Use a TOEFL word or two…"></textarea>
        <div class="composer-detect" id="composerDetect"></div>
      </div>
    </div>
    <div class="composer-bottom">
      <span class="muted" id="composerCount">0 / 500</span>
      <button class="post-btn" id="composerPost" disabled>Post</button>
    </div>
  </div>

  <!-- First-run preferences -->
  <div class="onboard" id="onboard" role="dialog" aria-modal="true" aria-label="Set up your feed" hidden>
    <div class="onboard-inner" id="onboardBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data/characters.js"></script>
  <script src="js/data/batch-1.js"></script>
  <script src="js/data/batch-2.js"></script>
  <script src="js/data/batch-3.js"></script>
  <script src="js/data/batch-4.js"></script>
  <script src="js/data/batch-5.js"></script>
  <script src="js/data/kk.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
