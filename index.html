<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vocab Threads">
  <meta name="description" content="A Threads-style feed where funny characters post with TOEFL vocabulary.">
  <title>Vocab Threads</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo" aria-hidden="true">@</span>
      <h1 class="topbar-title" id="topbarTitle">Vocab Threads</h1>
    </div>
  </header>

  <main>
    <!-- Home -->
    <section class="view" id="view-home">
      <div class="filters">
        <div class="chip-row" id="levelFilter" role="group" aria-label="Difficulty">
          <button class="chip" data-level="all">All levels</button>
          <button class="chip" data-level="1">Easy</button>
          <button class="chip" data-level="2">Medium</button>
          <button class="chip" data-level="3">Hard</button>
        </div>
        <div class="chip-row" id="langFilter" role="group" aria-label="Language">
          <button class="chip" data-lang="all">All voices</button>
          <button class="chip" data-lang="en">English only</button>
          <button class="chip" data-lang="mix">Mixed</button>
        </div>
      </div>
      <div class="composer-prompt" id="composerPrompt">
        <div class="avatar sm" id="promptAvatar"></div>
        <span>Start a thread… try using a new word!</span>
      </div>
      <div id="feed" class="feed"></div>
    </section>

    <!-- Review -->
    <section class="view" id="view-review" hidden>
      <div class="segmented" role="tablist">
        <button class="seg active" data-mode="list" role="tab">Word list</button>
        <button class="seg" data-mode="cards" role="tab">Flashcards</button>
      </div>
      <div id="reviewBody"></div>
    </section>

    <!-- Profile -->
    <section class="view" id="view-profile" hidden>
      <div id="profileBody"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-view="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-action="compose" aria-label="New thread">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
      <span>New</span>
    </button>
    <button class="tab" data-view="review" aria-label="Review">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
      <span>Review</span>
      <b class="badge" id="reviewBadge" hidden>0</b>
    </button>
    <button class="tab" data-view="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Word sheet -->
  <div class="overlay" id="sheetOverlay" hidden></div>
  <div class="sheet" id="wordSheet" role="dialog" aria-modal="true" aria-labelledby="sheetWord" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheetWord"></h2>
        <div class="sheet-meta"><span id="sheetPos"></span> <span class="level-tag" id="sheetLevel"></span></div>
      </div>
      <button class="icon-btn" id="speakBtn" aria-label="Pronounce">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
    </div>
    <p class="sheet-zh" id="sheetZh"></p>
    <div class="sheet-example">
      <div class="label">Example</div>
      <p id="sheetEx"></p>
      <p class="muted" id="sheetExZh"></p>
    </div>
    <button class="primary-btn" id="sheetSave"></button>
  </div>

  <!-- Composer -->
  <div class="composer" id="composer" role="dialog" aria-modal="true" aria-label="New thread" hidden>
    <div class="composer-top">
      <button class="text-btn" id="composerCancel">Cancel</button>
      <strong>New thread</strong>
      <span class="spacer"></span>
    </div>
    <div class="challenge">
      <div class="challenge-head">
        <span>🎯 Word challenge — tap to insert</span>
        <button class="text-btn small" id="challengeShuffle">Shuffle</button>
      </div>
      <div class="challenge-words" id="challengeWords"></div>
    </div>
    <div class="composer-body">
      <div class="avatar" id="composerAvatar"></div>
      <div class="composer-main">
        <div class="name" id="composerName"></div>
        <textarea id="composerText" maxlength="500" rows="5" placeholder="What's new? Use a TOEFL word or two…"></textarea>
        <div class="composer-detect" id="composerDetect"></div>
      </div>
    </div>
    <div class="composer-bottom">
      <span class="muted" id="composerCount">0 / 500</span>
      <button class="post-btn" id="composerPost" disabled>Post</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
