<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>toEfu video scene</title>
<!--
  Page that make-video.mjs renders frame by frame (Playwright screenshots → ffmpeg).
  window.init(spec) builds the episode; window.renderFrame(t) draws time t. Nothing here uses real time,
  so renders are repeatable. Design tokens: tokens.css · components: components/*.js · spec: docs/video-design-system.md
  Fonts: Google Fonts (DM Serif Display, DM Sans, Noto Sans TC); offline it falls back to system fonts.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=DM+Serif+Display&family=Noto+Sans+TC:wght@500;700;900&display=block">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { mount } from "./VideoTemplate.js";
  let tpl = null;
  window.init = async (spec) => { tpl = await mount(spec); };
  window.renderFrame = (t) => tpl.render(t);
</script>
</body>
</html>
