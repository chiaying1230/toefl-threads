<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>toEfu video scene</title>
<!--
  Deterministic motion-graphics renderer for the thread explainer clips.
  scripts/make-video.mjs calls window.init(spec) once, then window.renderFrame(t) for every frame.
  Nothing here uses real time: every pixel is a pure function of (spec, t), so renders are repeatable.
-->
<style>
  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; width: 540px; height: 960px; overflow: hidden; background: #FFF6E0;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", "Helvetica Neue", Arial, sans-serif;
    color: #2b2320;
  }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; }
  #progress { position: absolute; left: 0; top: 0; height: 7px; background: #ff4d4f; width: 0; z-index: 50; }
  #brand { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font-weight: 800; font-size: 18px; letter-spacing: .5px; opacity: .55; z-index: 40; }

  .pill { display: inline-block; padding: 8px 18px; border-radius: 999px; font-weight: 800; font-size: 22px; background: #2b2320; color: #FFD66B; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }
  .big-word { font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
  .hl { background: #FFD66B; color: #2b2320; padding: 2px 14px; border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* story bubble */
  .bubble { position: absolute; left: 28px; right: 28px; background: #fff; border-radius: 28px; padding: 24px 26px; box-shadow: 0 8px 0 rgba(0,0,0,.12); font-size: 27px; line-height: 1.42; font-weight: 600; }
  .tok { display: inline-block; white-space: pre; transition: none; padding: 0 2px; border-radius: 8px; }
  .tok.vocab { color: #1d6fe0; text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 3px; font-weight: 800; }
  .zh-line { font-size: 21px; color: #6b5f57; font-weight: 600; line-height: 1.4; }

  /* word card */
  .card { position: absolute; left: 24px; right: 24px; background: #fff; border-radius: 32px; padding: 26px 26px 22px; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .kk { font-size: 24px; color: #8b7f76; font-weight: 600; }
  .tag { display: inline-block; font-size: 17px; font-weight: 800; padding: 3px 12px; border-radius: 999px; margin-right: 8px; }
  .ex { font-size: 25px; line-height: 1.4; font-weight: 600; background: #FFF6E0; border-radius: 20px; padding: 16px 18px; }

  .cta-pill { position: absolute; left: 38px; right: 38px; background: #fff; border-radius: 26px; padding: 18px 22px; font-size: 26px; font-weight: 800; box-shadow: 0 7px 0 rgba(0,0,0,.14); display: flex; align-items: center; gap: 14px; }
  .cta-pill .ic { font-size: 34px; }

  #host { position: absolute; left: 0; top: 0; width: 220px; height: 220px; z-index: 30; transform-origin: 50% 85%; }
  #avatar { position: absolute; width: 150px; height: 150px; border-radius: 50%; font-size: 92px; line-height: 150px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.14); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="progress"></div>
  <div id="brand">toEfu 🧈 用串文背托福單字</div>

  <!-- scenes -->
  <div class="layer" id="s-hook"></div>
  <div class="layer" id="s-story"></div>
  <div class="layer" id="s-word"></div>
  <div class="layer" id="s-cta"></div>

  <!-- tofu host (lip-synced) -->
  <svg id="host" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="32" cy="58" rx="22" ry="3.5" fill="#000" opacity=".12"/>
    <g id="h-body">
      <rect x="8" y="18" width="48" height="38" rx="12" fill="#E9D3A3"/>
      <rect x="8" y="12" width="48" height="38" rx="12" fill="#FFF6E0" stroke="#E7CF9C" stroke-width="1.5"/>
      <path d="M17 19h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <g id="h-eyes">
        <g class="eye"><circle cx="23.5" cy="31" r="3" fill="#3B2F2F"/><circle cx="24.5" cy="30" r="1" fill="#fff"/></g>
        <g class="eye"><circle cx="40.5" cy="31" r="3" fill="#3B2F2F"/><circle cx="41.5" cy="30" r="1" fill="#fff"/></g>
      </g>
      <ellipse cx="17.5" cy="37" rx="4" ry="2.4" fill="#FFB4A8"/>
      <ellipse cx="46.5" cy="37" rx="4" ry="2.4" fill="#FFB4A8"/>
      <path id="h-smile" d="M28.5 37.5q3.5 3.5 7 0" stroke="#3B2F2F" stroke-width="2" fill="none" stroke-linecap="round"/>
      <g id="h-mouth" transform="translate(32 38.5)" style="display:none">
        <ellipse id="h-mouth-o" cx="0" cy="0" rx="3.6" ry="2" fill="#7a2e2e"/>
        <ellipse id="h-tongue" cx="0" cy="1" rx="2.2" ry="1" fill="#ff8f8f"/>
      </g>
      <!-- graduation cap -->
      <g transform="translate(32 12)">
        <polygon points="-17,0 0,-7.5 17,0 0,7.5" fill="#2f3b52"/>
        <path d="M-8 3.5v5.5q8 4 16 0v-5.5" fill="#3b4a68"/>
        <path d="M14 0.5v8" stroke="#FFD66B" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="14" cy="9.5" r="1.6" fill="#FFD66B"/>
      </g>
    </g>
  </svg>
</div>

<script>
(function () {
  var S, stage = document.getElementById("stage");
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var easeOut = function (p) { return 1 - Math.pow(1 - clamp(p, 0, 1), 3); };
  var easeBack = function (p) { p = clamp(p, 0, 1); var c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var hash = function (s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };

  // A pop-in: element scales/fades in from `delay` seconds into the scene.
  function pop(el, local, delay, opts) {
    opts = opts || {};
    var p = (local - delay) / (opts.dur || 0.35);
    var e = easeBack(p), vis = p > 0;
    el.style.opacity = vis ? clamp(p * 3, 0, 1) : 0;
    el.style.transform = (opts.base || "") + " translateY(" + ((1 - easeOut(p)) * (opts.rise == null ? 30 : opts.rise)) + "px) scale(" + (vis ? lerp(0.6, 1, clamp(e, 0, 1.15)) : 0.6) + ")";
  }

  // ---------- speech activity (drives the mouth) ----------
  var allTokens = [];
  function speaking(t, speaker) {
    for (var i = 0; i < allTokens.length; i++) {
      var k = allTokens[i];
      if (k.speaker !== speaker || t < k.s || t > k.e) continue;
      var d = k.e - k.s, x = t - k.s;
      var env = Math.min(1, x / 0.05, (d - x) / 0.05);
      var seed = 0.65 + 0.35 * ((hash(k.text) % 7) / 6);
      return clamp(env, 0, 1) * seed * (0.45 + 0.55 * Math.abs(Math.sin(x * Math.PI * 6.2)));
    }
    return 0;
  }
  function tokenAt(t, speaker) {
    var best = null;
    for (var i = 0; i < allTokens.length; i++) { var k = allTokens[i]; if (k.speaker === speaker && t >= k.s) best = k; }
    return best;
  }

  // ---------- host ----------
  var POSE = { hook: { x: 160, y: 580, s: 1.0 }, story: { x: -10, y: 700, s: 0.7 }, word: { x: 20, y: 640, s: 0.95 }, cta: { x: 150, y: 560, s: 1.1 } };
  function hostFrame(t, scene, local) {
    var cur = POSE[scene.type], prev = scene.prevType ? POSE[scene.prevType] : cur;
    var p = easeOut(local / 0.4);
    var x = lerp(prev.x, cur.x, p), y = lerp(prev.y, cur.y, p), s = lerp(prev.s, cur.s, p);
    var talk = speaking(t, "host");
    var bob = Math.sin(t * 2.6) * 4 + talk * -10;
    var squash = 1 + talk * 0.07;
    var tilt = Math.sin(t * 1.7) * 2.5 + (scene.type === "cta" ? Math.sin(t * 6) * 3 : 0);
    var h = $("host");
    h.style.width = h.style.height = "220px";
    h.style.transform = "translate(" + x + "px," + (y + bob) + "px) scale(" + s * (2 - squash) + "," + s * squash + ") rotate(" + tilt + "deg)";
    // mouth
    var o = $("h-mouth"), sm = $("h-smile");
    if (talk > 0.08) {
      sm.style.display = "none"; o.style.display = "";
      $("h-mouth-o").setAttribute("ry", (0.7 + talk * 3.6).toFixed(2));
      $("h-mouth-o").setAttribute("rx", (3.2 + talk * 0.8).toFixed(2));
      $("h-tongue").setAttribute("cy", (0.6 + talk * 1.2).toFixed(2));
      $("h-tongue").setAttribute("ry", (0.3 + talk * 1.2).toFixed(2));
    } else { sm.style.display = ""; o.style.display = "none"; }
    // blink every ~3.1 s
    var b = (t % 3.1), blink = b < 0.12 ? Math.sin((b / 0.12) * Math.PI) : 0;
    var eyes = $("h-eyes").children;
    for (var i = 0; i < eyes.length; i++) eyes[i].setAttribute("transform", "translate(0 " + (31 * blink) + ") scale(1 " + (1 - 0.9 * blink) + ")");
  }

  // ---------- background ----------
  var BG = { hook: ["#FF6B6B", "#FFD66B"], story: null, word: ["#FFD66B", "#FFB74D"], cta: ["#7ee081", "#FFD66B"] };
  function bgFrame(t, scene) {
    var cols = BG[scene.type] || [S.char.color, "#FFF6E0"];
    var bg = $("bg");
    bg.style.cssText = "position:absolute;inset:0;background:linear-gradient(" + (160 + Math.sin(t * 0.5) * 20) + "deg," + cols[0] + "," + cols[1] + ")";
    var blobs = bg.children;
    if (!blobs.length) for (var i = 0; i < 5; i++) { var d = document.createElement("div"); d.className = "blob"; bg.appendChild(d); }
    for (var j = 0; j < blobs.length; j++) {
      var r = 120 + j * 40, bx = 270 + Math.sin(t * (0.3 + j * 0.11) + j) * 260, by = 480 + Math.cos(t * (0.25 + j * 0.07) + j * 2) * 420;
      blobs[j].style.cssText = "width:" + r + "px;height:" + r + "px;left:" + (bx - r / 2) + "px;top:" + (by - r / 2) + "px;background:rgba(255,255,255," + (0.14 + (j % 3) * 0.05) + ")";
    }
  }

  // ---------- karaoke ----------
  function karaokeHtml(tokens, joiner) {
    return tokens.map(function (k, i) {
      return '<span class="tok' + (k.key ? " vocab" : "") + '" data-i="' + i + '">' + esc(k.text) + "</span>" + (i < tokens.length - 1 ? joiner : "");
    }).join("");
  }
  function karaokeUpdate(root, tokens, t, teach) {
    var spans = root.querySelectorAll(".tok");
    for (var i = 0; i < spans.length; i++) {
      var k = tokens[i], sp = spans[i], on = t >= k.s, cur = t >= k.s && t < k.e + 0.05;
      sp.style.opacity = on ? 1 : 0.32;
      sp.style.background = cur ? "#FFD66B" : "transparent";
      var strong = k.key && teach.indexOf(k.key) >= 0;
      sp.style.transform = cur ? "scale(" + (strong ? 1.18 : 1.08) + ")" : "scale(1)";
      if (k.key) sp.style.opacity = on ? 1 : 0.7;
    }
  }

  // ---------- scene builders ----------
  var built = {};
  function build() {
    S.scenes.forEach(function (sc, idx) {
      var el = $("s-" + sc.type);
      if (sc.type === "hook") {
        el.innerHTML =
          '<div class="center" id="hk-pill" style="top:120px"><span class="pill">⭐ TOEFL 必考字 · ' + esc(sc.level) + '</span></div>' +
          '<div class="center big-word" id="hk-word" style="top:215px;font-size:' + (sc.word.length > 11 ? 56 : 72) + 'px"><span class="hl">' + esc(sc.word) + '</span></div>' +
          '<div class="center" id="hk-q" style="top:365px;font-size:92px;font-weight:900;color:#d4202a;-webkit-text-stroke:3px #fff;paint-order:stroke fill">' + esc(sc.question) + '</div>' +
          '<div class="abs" id="hk-x" style="right:50px;top:470px;font-size:84px">🤔</div>';
      } else if (sc.type === "story") {
        var a = S.char;
        el.innerHTML =
          '<div id="avatar" style="left:34px;top:92px;background:' + esc(a.color) + '">' + a.avatar + '</div>' +
          '<div class="ring" id="st-ring" style="left:34px;top:92px;width:138px;height:138px;border-color:#fff"></div>' +
          '<div class="abs" id="st-name" style="left:200px;top:112px;font-weight:900;font-size:34px;line-height:1.1">' + esc(a.name) + '<div style="font-size:19px;font-weight:600;opacity:.65">@' + esc(a.handle) + ' · ' + esc(a.topic) + '</div></div>' +
          '<div class="bubble" id="st-bubble" style="top:270px"><div id="st-text"></div><div class="zh-line" id="st-zh" style="margin-top:16px"></div></div>';
        $("st-text").innerHTML = karaokeHtml(S.lines[sc.line].tokens, " ");
        $("st-zh").textContent = sc.zh || "";
      } else if (sc.type === "cta") {
        buildCta(el, sc);
      }
    });
  }

  // Word cards share one layer, so each is built when its turn comes.
  function buildWord(sc) {
    var el = $("s-word"), ex = S.lines[sc.lines.ex];
    el.dataset.key = sc.key;
        el.innerHTML =
          '<div class="center" id="w-count" style="top:92px"><span class="pill">' + esc(sc.index + "/" + sc.total) + ' · ' + esc(sc.level) + '</span></div>' +
          '<div class="card" id="w-card" style="top:150px">' +
            '<div class="big-word" id="w-word" style="font-size:' + (sc.word.length > 11 ? 50 : 64) + 'px;color:#1d6fe0">' + esc(sc.word) + '</div>' +
            '<div class="kk">' + esc(sc.kk || "") + ' <span class="tag" style="background:#2b2320;color:#FFD66B;margin-left:6px">' + esc(sc.pos) + '</span></div>' +
            '<div id="w-zh" style="font-size:46px;font-weight:900;color:#d4202a;margin:14px 0 14px;line-height:1.15">' + esc(sc.zh) + '</div>' +
            '<div class="ex" id="w-ex"><div id="w-ex-en"></div><div class="zh-line" id="w-ex-zh" style="margin-top:8px"></div></div>' +
          '</div>';
        $("w-ex-en").innerHTML = karaokeHtml(ex.tokens, " ");
        $("w-ex-zh").textContent = sc.exZh || "";
  }

  function buildCta(el, sc) {
        el.innerHTML =
          '<div class="center big-word" id="c-title" style="top:100px;font-size:60px"><span class="hl">考前一定用得上！</span></div>' +
          '<div class="cta-pill" id="c-1" style="top:230px"><span class="ic">🔖</span>收藏起來，考前複習</div>' +
          '<div class="cta-pill" id="c-2" style="top:330px"><span class="ic">💬</span>留言用 <span style="color:#1d6fe0">' + esc(sc.word) + '</span> 造句</div>' +
          '<div class="cta-pill" id="c-3" style="top:430px"><span class="ic">➕</span>追蹤 toEfu，每天一篇</div>' +
          '<div class="abs" id="c-arrow" style="right:56px;top:540px;font-size:80px">👇</div>';
  }

  function sceneAt(t) {
    for (var i = 0; i < S.scenes.length; i++) if (t >= S.scenes[i].start && t < S.scenes[i].end) return S.scenes[i];
    return S.scenes[S.scenes.length - 1];
  }

  window.init = function (spec) {
    S = spec;
    allTokens = [];
    S.lines.forEach(function (l) { l.tokens.forEach(function (k) { allTokens.push({ speaker: l.speaker, s: k.s, e: k.e, text: k.text }); }); });
    S.scenes.forEach(function (sc, i) { sc.prevType = i ? S.scenes[i - 1].type : null; });
    build();
  };

  window.renderFrame = function (t) {
    var sc = sceneAt(t), local = t - sc.start;
    var layers = ["hook", "story", "word", "cta"];
    layers.forEach(function (n) { $("s-" + n).style.opacity = 0; });
    var el = $("s-" + sc.type);
    el.style.opacity = 1;
    $("progress").style.width = (clamp(t / S.duration, 0, 1) * 100) + "%";
    bgFrame(t, sc);
    hostFrame(t, sc, local);

    if (sc.type === "hook") {
      pop($("hk-pill"), local, 0.05);
      var w = $("hk-word"); pop(w, local, 0.0, { dur: 0.3 });
      var shake = local < 0.9 ? Math.sin(local * 60) * 5 * (1 - local / 0.9) : 0;
      w.style.transform += " rotate(" + shake * 0.3 + "deg) translateX(" + shake + "px)";
      pop($("hk-q"), local, S.lines[sc.lines[1]].start - sc.start, { dur: 0.3, base: "rotate(-4deg)" });
      pop($("hk-x"), local, S.lines[sc.lines[1]].start - sc.start + 0.1, { base: "rotate(" + Math.sin(t * 5) * 8 + "deg)" });
    } else if (sc.type === "story") {
      var talk = speaking(t, "char");
      var av = $("avatar");
      av.style.transform = "translateY(" + (-talk * 14) + "px) scale(" + (1 + talk * 0.08) + "," + (1 - talk * 0.05) + ") rotate(" + (Math.sin(t * 7) * talk * 6) + "deg)";
      var ring = $("st-ring"), ph = (t * 1.6) % 1;
      ring.style.opacity = talk > 0.05 ? (1 - ph) * 0.9 : 0;
      ring.style.transform = "translateY(" + (-talk * 14) + "px) scale(" + (1 + ph * 0.45) + ")";
      pop($("st-bubble"), local, 0.05, { dur: 0.4, rise: 40 });
      var line = S.lines[sc.line];
      karaokeUpdate($("st-text"), line.tokens, t, sc.teach);
      var zh = $("st-zh");
      zh.style.opacity = clamp((t - line.end) / 0.3, 0, 1);
      pop($("st-name"), local, 0.0, { dur: 0.3, rise: 0 });
    } else if (sc.type === "word") {
      if ($("s-word").dataset.key !== sc.key) buildWord(sc);
      pop($("w-count"), local, 0.0);
      pop($("w-card"), local, 0.05, { dur: 0.4, rise: 50 });
      var lw = S.lines[sc.lines.word], lm = S.lines[sc.lines.mean], le = S.lines[sc.lines.ex];
      var ww = $("w-word"), spoken = t - lw.start;
      ww.style.transformOrigin = "left center";
      ww.style.transform = spoken > 0 && spoken < 0.5 ? "scale(" + (1 + Math.sin(spoken / 0.5 * Math.PI) * 0.12) + ")" : "none";
      var zhEl = $("w-zh"); pop(zhEl, local, lm.start - sc.start - 0.05, { dur: 0.35, rise: 24 });
      zhEl.style.transformOrigin = "left center";
      pop($("w-ex"), local, le.start - sc.start - 0.25, { dur: 0.4, rise: 30 });
      karaokeUpdate($("w-ex-en"), le.tokens, t, [sc.key]);
      $("w-ex-zh").style.opacity = clamp((t - le.start - 0.4) / 0.4, 0, 1);
    } else if (sc.type === "cta") {
      pop($("c-title"), local, 0.0, { dur: 0.35 });
      var c1 = S.lines[sc.lines[0]].start - sc.start, c2 = S.lines[sc.lines[1]].start - sc.start, c3 = S.lines[sc.lines[2]].start - sc.start;
      pop($("c-1"), local, c1 - 0.1); pop($("c-2"), local, c2 - 0.1); pop($("c-3"), local, c3 - 0.1);
      var ar = $("c-arrow"); pop(ar, local, c2); ar.style.transform += " translateY(" + (Math.abs(Math.sin(t * 5)) * -26) + "px)";
      [1, 2, 3].forEach(function (n) {
        var pill = $("c-" + n), k = tokenAt(t, "host");
        var ln = S.lines[sc.lines[n - 1]];
        if (t >= ln.start && t < ln.end + 0.2) pill.style.boxShadow = "0 7px 0 #ff4d4f";
        else pill.style.boxShadow = "0 7px 0 rgba(0,0,0,.14)";
      });
    }
    return sc.type;
  };
})();
</script>
</body>
</html>
