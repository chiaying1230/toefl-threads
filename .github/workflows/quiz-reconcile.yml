name: Quiz statistics reconcile

# Once a day (about 04:30 Taiwan time): checks the new /quiz results and corrects quizStats/all and the day documents.
# Uses the same repository secret as the notifications: FIREBASE_SERVICE_ACCOUNT.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: quiz-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/quiz/package-lock.json
      - run: npm ci --prefix scripts/quiz --omit=dev --no-audit --no-fund
      - run: node scripts/quiz/reconcile.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
