<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/studio.ico?v=tofu-studio"><link rel="apple-touch-icon" href="/studio-cover.png"><link rel="stylesheet" href="/studio-brand.css"><title>批量產生 · toEfu</title><link rel="stylesheet" href="/videos.css"><script src="/batch.js" defer></script></head><body><header class="studio-header"><strong><img src="/studio-cover.png" alt="" width="42" height="42">toEfu · 批量產生</strong><nav><a href="/">工作室</a> · <a href="/videos">影片資料夾</a></nav></header><main><h1>讓工作室自己做一批影片</h1><p>系統自選尚未建立的文章、接續集數，教完每篇文章的所有單字，安排原文開場與測驗，套用配樂和來源翻譯。中文原文只顯示、不朗讀。做好後，你只確認最後影片。</p><p>開始後可以關閉頁面，但請保持工作室與電腦運行。中斷後不會自動重送付費語音。</p><section><label>這次做幾支？<input id="count" type="number" min="1" max="20" value="3"></label><label>系列<select id="pack"><option value="">各系列自動搭配</option value="toefl">TOEFL</option><option value="toeic">TOEIC</option><option value="ielts">IELTS</option><option value="hs">高中</option><option value="elem">國小國中</option></select></label><button id="prepare">自動選文章，免費估算這一批</button></section><p id="message" role="status" aria-live="polite"></p><h2>待確認</h2><p>通過製作檢查的影片會出現在這裡。看完按一次確認即可。</p><div id="review-list"></div><h2>批次進度與語音需求</h2><div id="batches"></div></main></body></html>
